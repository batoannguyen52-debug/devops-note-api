name: CI/CD Pipeline
on:
  push:
    branches: [main, feat/production-readiness]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: note-api-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongodb:
        image: mongo:6.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand(\"ping\").ok ? 0 : 1)'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/notedb_test
      - name: Validate scripts and Compose
        run: |
          bash -n scripts/*.sh
          docker compose config --quiet
  operations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t devops-note-api:review .
      - name: Backup, restore and three isolated failure drills
        run: |
          mkdir -p work
          set -o pipefail
          bash scripts/verify-operations.sh 2>&1 | tee work/operations.log
        env:
          COMPOSE_PROJECT_NAME: note-check-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operations-evidence
          path: work/operations.log
          retention-days: 30
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify failed rollout restores the previous image and data
        run: |
          mkdir -p work
          set -o pipefail
          bash scripts/verify-rollback.sh 2>&1 | tee work/rollback.log
        env:
          COMPOSE_PROJECT_NAME: note-check-rollback-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rollback-evidence
          path: work/rollback.log
          retention-days: 30
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, operations, rollback]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy exact tested commit to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: DEPLOY_SHA
          command_timeout: 12m
          script: |
            set -eu
            cd ~/devops-note-api
            git fetch origin main
            # Legacy pipeline ran chmod on tracked scripts. Ignore only mode drift;
            # Git still refuses to overwrite local content edits.
            git -c core.fileMode=false checkout --detach "$DEPLOY_SHA"
            sudo bash scripts/deploy.sh "$DEPLOY_SHA"
